; Battlezone 1.5 shim settings.
; Place next to bzone.exe. Every key is optional; the defaults are shown.

[Fullscreen]
; borderless : convert the game's exclusive fullscreen device into a borderless
;              window covering the monitor. This is what makes the shell/menu
;              layer visible, because Battlezone paints it with GDI and that no
;              longer works over an exclusive D3D9 swap chain on modern drivers.
; off        : leave the game completely stock (use this to compare behaviour).
Mode=borderless

; aspect  : upscale the 640x480 shell to the screen height and pillarbox it, so
;           the menu keeps its 4:3 proportions. Missions running at your native
;           resolution are untouched.
; stretch : upscale to the full screen, ignoring aspect ratio.
; center  : no upscale; the shell stays 640x480 in the middle of a black screen.
Scaling=aspect

; auto    : ask Present to stretch into the destination rect, and fall back to
;           gdi permanently if the runtime rejects it.
; present : only ever use Present (no fallback).
; gdi     : always upscale with StretchBlt from the back buffer DC. Use this if
;           auto still leaves the shell unscaled.
Blit=auto
