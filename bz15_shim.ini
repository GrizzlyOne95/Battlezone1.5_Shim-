; Battlezone 1.5 shim settings.
; Place next to bzone.exe. Every key is optional; the default is shown.

[Fullscreen]
; Battlezone's shell (main menu, options, mission select) is a Win32 dialog
; drawn with GDI as a child of the game window, not a D3D surface. Under an
; exclusive D3D9 swap chain modern drivers never composite it, which is why the
; menus are invisible until you Alt+Enter into a window. Missions are pure D3D
; and are unaffected.
;
; mirror      : keep your desktop resolution. The game window stays 640x480 and
;               a fullscreen host window mirrors it with a DWM thumbnail (the
;               same mechanism as taskbar previews), scaled on the GPU and
;               aspect-corrected. Mouse input is mapped back into the game.
;               No monitor mode switching at all. Missions at your native
;               resolution bypass the mirror entirely.
; displaymode : take the device out of exclusive mode so the dialog is visible
;               again, and put the monitor into the resolution the game asked
;               for so your panel upscales it -- the same thing exclusive
;               fullscreen was doing implicitly. The shell fills the screen.
;               Costs a monitor mode switch entering and leaving a mission.
; center      : leave the desktop resolution alone and just centre a borderless
;               window. The menus are visible but stay physically 640x480.
;               No mode switching, so no monitor resync.
; off         : leave the game completely stock, for comparison.
Mode=mirror

; Only used by Mode=mirror.
; stretch : fill the screen. The 4:3 shell is stretched to 16:9.
; fit     : pillarbox to keep the shell's original 4:3 proportions.
MirrorAspect=stretch

[Hud]
; The cockpit HUD -- radar, weapon panel, gauges, reticle, text -- is drawn in
; fixed 640x480 pixels, so it keeps its original physical size no matter what
; resolution you play at. At 1080p it is half the size it was designed to be,
; and at 4K roughly a quarter, tucked into the corners of the screen.
;
; This scales the whole 2D pass by a whole-number factor: the game keeps laying
; the HUD out for a small screen, and every sprite, glyph, bar and line is
; multiplied on its way to the screen. Text scales with it, because the font is
; drawn as sprites.
;
; The factor is a whole number on purpose. The HUD is hand-drawn pixel art
; packed into a shared texture, so a fractional scale softens it and bleeds
; neighbouring sprites into each other at the edges.
;
; auto : match the resolution -- 1x below 960 high, 2x at 1080p, 3x at 1440p,
;        4x at 4K. This is floor(height / 480).
; 1    : leave the HUD completely stock. No patch is installed at all, so this
;        is the setting to compare against if anything looks wrong.
; 2..16: force a specific factor, for taste or for ultrawide panels where the
;        automatic choice is not what you want.
;
; Two things are deliberately left alone. The target camera already sizes
; itself from the resolution, so it is excluded and keeps scaling as it always
; did. The software radar mesh (D3RadarType=1) is drawn straight into raw
; pixels rather than through the 2D primitives, so it cannot be scaled by this
; hardware-renderer fix.
Scale=auto

[Movies]
; 45 of the 52 menu clips are Indeo Video 5. Microsoft removed the Indeo
; decoders from Windows years ago, so nothing on a modern machine can decode
; them: the anims\*.avi fail to open at all (MCI error 6, "there is no driver
; installed on your system") and the movie\*.avi cutscenes play their
; soundtrack over a blank rectangle, because only their video stream is
; undecodable.
;
; on  : register an Indeo Video 5 decoder inside the game's own process, so MCI
;       plays the stock files exactly as shipped. Nothing is installed
;       system-wide, no registry key is written, and no file is converted or
;       cached. If the machine already has a working Indeo codec, that one is
;       left in charge and this does nothing.
; off : leave the decoding to Windows. Clips Windows cannot decode then fall
;       back to being transcoded with ffmpeg.exe into
;       LOCALAPPDATA\bz15shim\mv, which is the older behaviour and needs
;       ffmpeg.exe next to winmm.dll or on PATH.
Codec=on
